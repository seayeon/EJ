<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="근태 기록">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>근태 기록</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151d31;--muted:#9aa7bd;--line:#28334a;--green:#49d49a;--white:#f5f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a2945 0,#0b1020 58%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
main{width:100%;max-width:480px;padding:34px 0 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:15px;font-weight:700;letter-spacing:.04em}.today{font-size:12px;color:var(--muted);text-align:right}
.panel{background:linear-gradient(145deg,rgba(29,41,65,.96),rgba(19,28,47,.96));border:1px solid var(--line);border-radius:26px;padding:26px 22px;box-shadow:0 18px 55px #0005}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.12em;font-weight:700}.timer{font-size:clamp(46px,13vw,64px);font-weight:750;letter-spacing:-.055em;font-variant-numeric:tabular-nums;margin:12px 0 4px}.sub{font-size:13px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:19px;border:1px solid #326a5a;background:#153b33;color:#8cf0c3;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:700}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green)}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.detail{background:#0e1729;border:1px solid var(--line);border-radius:17px;padding:16px}.label{font-size:12px;color:var(--muted);margin-bottom:9px}.value{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
button{width:100%;border:0;border-radius:15px;padding:17px;margin-top:13px;background:var(--green);color:#06271c;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 9px 24px #49d49a30}button:disabled{background:#344258;color:#9aa7bd;box-shadow:none;cursor:default}
button.secondary{background:#26344d;color:#e7edf8;border:1px solid #3b4b67;box-shadow:none}
.editor{display:none;margin-top:16px;padding:16px;background:#0e1729;border:1px solid var(--line);border-radius:17px}.editor.open{display:block}.editor label{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}
input[type=number]{width:100%;padding:14px 8px;border-radius:12px;border:1px solid #40506a;background:#18243a;color:#fff;font:700 20px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center}
.time-parts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.time-parts label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{margin-top:12px}
.note{font-size:12px;line-height:1.65;color:var(--muted);margin:18px 3px 0}.foot{text-align:center;color:#66748c;font-size:11px;margin-top:25px}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand">◷ &nbsp;근태 기록</div><div class="today" id="dateLabel">오늘</div></div>
  <section class="panel">
    <div class="eyebrow">TODAY'S WORK TIME</div>
    <div class="timer" id="timer">00:00:00</div>
    <div class="sub">오늘 누적 근무 시간</div>
    <div class="status" id="status">출근 전</div>
    <div class="details">
      <div class="detail"><div class="label">출근 시간</div><div class="value" id="clockIn">--:--:--</div></div>
      <div class="detail"><div class="label">퇴근 시간</div><div class="value" id="clockOut">--:--:--</div></div>
    </div>
    <div class="detail" style="margin-top:12px">
      <div class="label" id="weekLabel">이번 주 누적 근무 시간</div>
      <div class="value" id="weekTotal" style="font-size:25px">00:00:00</div>
      <div class="sub" id="weekRange" style="margin-top:6px">월요일 ~ 일요일</div>
    </div>
    <div class="actions">
      <button type="button" id="clockInButton">출근</button>
      <button type="button" id="clockOutButton">퇴근</button>
    </div>
    <div class="actions">
      <button type="button" class="secondary" id="editInToggle">출근 시간 수정</button>
      <button type="button" class="secondary" id="editOutToggle">퇴근 시간 수정</button>
    </div>
    <div class="editor" id="editInPanel">
      <label>출근 시간 (시·분·초)</label>
      <div class="time-parts">
        <div><label for="inHour">시</label><input id="inHour" type="number" min="0" max="23" inputmode="numeric" placeholder="09"></div>
        <div><label for="inMinute">분</label><input id="inMinute" type="number" min="0" max="59" inputmode="numeric" placeholder="00"></div>
        <div><label for="inSecond">초</label><input id="inSecond" type="number" min="0" max="59" inputmode="numeric" placeholder="00"></div>
      </div>
      <div class="actions">
        <button type="button" class="secondary" id="cancelIn">취소</button>
        <button type="button" id="saveIn">출근 시간 저장</button>
      </div>
    </div>
    <div class="editor" id="editOutPanel">
      <label>퇴근 시간 (시·분·초)</label>
      <div class="time-parts">
        <div><label for="outHour">시</label><input id="outHour" type="number" min="0" max="23" inputmode="numeric" placeholder="18"></div>
        <div><label for="outMinute">분</label><input id="outMinute" type="number" min="0" max="59" inputmode="numeric" placeholder="00"></div>
        <div><label for="outSecond">초</label><input id="outSecond" type="number" min="0" max="59" inputmode="numeric" placeholder="00"></div>
      </div>
      <div class="actions">
        <button type="button" class="secondary" id="cancelOut">취소</button>
        <button type="button" id="saveOut">퇴근 시간 저장</button>
      </div>
    </div>
  </section>
  <p class="note">출근 버튼으로 측정을 시작하고 퇴근 버튼으로 종료합니다. 퇴근 시간도 직접 입력하거나 수정할 수 있습니다. 자정까지 퇴근 기록이 없으면 자정에 자동 종료되며, 주간 누적은 월요일에 초기화됩니다. 기록은 이 기기의 브라우저에만 저장됩니다.</p>
  <div class="foot">개인용 근태 기록 · 이 기기에서만 사용</div>
</main>
<script>
(function () {
  "use strict";
  const CURRENT_KEY = "attendance-current-v2";
  const WEEK_KEY = "personal-attendance-week-v1";
  const $ = (id) => document.getElementById(id);
  let current = null;
  let weekData = {};

  function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  function todayKey() { return dateKey(new Date()); }
  function mondayDate(date) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d;
  }
  function thisWeekKey() { return dateKey(mondayDate(new Date())); }
  function timeText(timestamp) {
    const d = new Date(timestamp);
    return [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(v => String(v).padStart(2, "0")).join(":");
  }
  function durationText(ms) {
    const n = Math.max(0, Math.floor(ms / 1000));
    return [Math.floor(n / 3600), Math.floor(n % 3600 / 60), n % 60]
      .map(v => String(v).padStart(2, "0")).join(":");
  }
  function readJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); }
    catch (_) { return null; }
  }
  function saveCurrent() {
    if (current) localStorage.setItem(CURRENT_KEY, JSON.stringify(current));
    else localStorage.removeItem(CURRENT_KEY);
  }
  function saveWeek() {
    localStorage.setItem(WEEK_KEY, JSON.stringify({ week: thisWeekKey(), days: weekData }));
  }
  function loadData() {
    const savedWeek = readJSON(WEEK_KEY);
    if (savedWeek && savedWeek.week === thisWeekKey() && savedWeek.days && typeof savedWeek.days === "object") {
      weekData = savedWeek.days;
    } else {
      weekData = {};
      saveWeek();
    }

    const saved = readJSON(CURRENT_KEY);
    current = saved && saved.date === todayKey() &&
      Number.isFinite(saved.clockIn) &&
      (saved.clockOut === null || Number.isFinite(saved.clockOut))
      ? saved : null;

    // If a shift was left open overnight, close it at midnight of its recorded day.
    if (!current && saved && saved.date && Number.isFinite(saved.clockIn)) {
      const oldDate = new Date(saved.date + "T00:00:00");
      const midnight = new Date(oldDate.getFullYear(), oldDate.getMonth(), oldDate.getDate() + 1).getTime();
      const oldWeekStart = dateKey(mondayDate(oldDate));
      if (oldWeekStart === thisWeekKey()) {
        weekData[saved.date] = { clockIn: saved.clockIn, clockOut: Number.isFinite(saved.clockOut) ? saved.clockOut : midnight };
        saveWeek();
      }
      localStorage.removeItem(CURRENT_KEY);
    }
    if (current) {
      weekData[current.date] = { clockIn: current.clockIn, clockOut: current.clockOut };
      saveWeek();
    }
  }
  function weeklyTotal(now) {
    let total = 0;
    const start = mondayDate(now).getTime();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1).getTime();
    Object.keys(weekData).forEach(key => {
      const d = new Date(key + "T00:00:00");
      const dayStart = d.getTime();
      if (dayStart < start || dayStart >= tomorrow) return;
      const item = weekData[key];
      if (!item || !Number.isFinite(item.clockIn)) return;
      const cap = Math.min(now.getTime(), dayStart + 86400000);
      const out = Number.isFinite(item.clockOut) ? item.clockOut : cap;
      total += Math.max(0, Math.min(out, cap) - item.clockIn);
    });
    return total;
  }
  function render() {
    const now = new Date();
    $("dateLabel").textContent = new Intl.DateTimeFormat("ko-KR", {
      year: "numeric", month: "long", day: "numeric", weekday: "long"
    }).format(now);

    const monday = mondayDate(now);
    const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
    const shortDate = d => `${d.getMonth() + 1}.${d.getDate()}`;
    $("weekRange").textContent = `${shortDate(monday)} ~ ${shortDate(sunday)} 기준`;

    if (current) {
      const end = Number.isFinite(current.clockOut) ? current.clockOut : now.getTime();
      $("timer").textContent = durationText(end - current.clockIn);
      $("clockIn").textContent = timeText(current.clockIn);
      $("clockOut").textContent = Number.isFinite(current.clockOut) ? timeText(current.clockOut) : "근무 중";
      $("status").textContent = Number.isFinite(current.clockOut) ? "퇴근 완료" : "근무 중";
    } else {
      $("timer").textContent = "00:00:00";
      $("clockIn").textContent = "--:--:--";
      $("clockOut").textContent = "--:--:--";
      $("status").textContent = "출근 전";
    }
    $("weekTotal").textContent = durationText(weeklyTotal(now));
  }
  function startShift(timestamp) {
    current = { date: todayKey(), clockIn: timestamp, clockOut: null };
    weekData[current.date] = { clockIn: timestamp, clockOut: null };
    saveCurrent();
    saveWeek();
    render();
  }
  function finishShift(timestamp) {
    if (!current) {
      alert("먼저 출근 버튼을 눌러주세요.");
      return;
    }
    if (timestamp < current.clockIn) {
      alert("퇴근 시간은 출근 시간보다 늦어야 합니다.");
      return;
    }
    current.clockOut = timestamp;
    weekData[current.date] = { clockIn: current.clockIn, clockOut: timestamp };
    saveCurrent();
    saveWeek();
    render();
  }
  function readTimeInputs(prefix) {
    const ids = [prefix + "Hour", prefix + "Minute", prefix + "Second"];
    const values = ids.map(id => $(id).value.trim());
    const nums = values.map(Number);
    if (values.some(v => v === "") ||
        !Number.isInteger(nums[0]) || nums[0] < 0 || nums[0] > 23 ||
        !Number.isInteger(nums[1]) || nums[1] < 0 || nums[1] > 59 ||
        !Number.isInteger(nums[2]) || nums[2] < 0 || nums[2] > 59) {
      alert("시(0~23), 분(0~59), 초(0~59)를 올바르게 입력해 주세요.");
      return null;
    }
    const now = new Date();
    const ts = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
      nums[0], nums[1], nums[2]).getTime();
    if (ts > Date.now() && !confirm("현재 시각보다 늦은 시간입니다. 저장할까요?")) return null;
    return ts;
  }
  function fillTimeInputs(prefix, timestamp) {
    const d = new Date(timestamp);
    $(prefix + "Hour").value = String(d.getHours()).padStart(2, "0");
    $(prefix + "Minute").value = String(d.getMinutes()).padStart(2, "0");
    $(prefix + "Second").value = String(d.getSeconds()).padStart(2, "0");
  }

  // Event listeners are installed after all page elements have been parsed.
  $("clockInButton").addEventListener("click", function () {
    if (current && !Number.isFinite(current.clockOut)) {
      alert("이미 근무 중입니다. 출근 시간은 위에 표시되어 있습니다.");
      render();
      return;
    }
    if (current && Number.isFinite(current.clockOut)) {
      alert("오늘은 이미 퇴근 처리했습니다.");
      return;
    }
    startShift(Date.now());
  });
  $("clockOutButton").addEventListener("click", function () {
    if (!current) {
      alert("먼저 출근 버튼을 눌러주세요.");
      return;
    }
    if (Number.isFinite(current.clockOut)) {
      alert("이미 퇴근 처리했습니다.");
      return;
    }
    finishShift(Date.now());
  });

  $("editInToggle").addEventListener("click", function () {
    const panel = $("editInPanel");
    if (!panel.classList.contains("open")) {
      fillTimeInputs("in", current ? current.clockIn : Date.now());
      panel.classList.add("open");
    } else panel.classList.remove("open");
  });
  $("editOutToggle").addEventListener("click", function () {
    if (!current) {
      alert("먼저 출근 버튼을 눌러주세요.");
      return;
    }
    const panel = $("editOutPanel");
    if (!panel.classList.contains("open")) {
      fillTimeInputs("out", Number.isFinite(current.clockOut) ? current.clockOut : Date.now());
      panel.classList.add("open");
    } else panel.classList.remove("open");
  });
  $("cancelIn").addEventListener("click", () => $("editInPanel").classList.remove("open"));
  $("cancelOut").addEventListener("click", () => $("editOutPanel").classList.remove("open"));
  $("saveIn").addEventListener("click", function () {
    const ts = readTimeInputs("in");
    if (ts === null) return;
    if (current && Number.isFinite(current.clockOut) && ts > current.clockOut) {
      alert("출근 시간은 퇴근 시간보다 빨라야 합니다.");
      return;
    }
    if (!current) startShift(ts);
    else {
      current.clockIn = ts;
      weekData[current.date] = { clockIn: ts, clockOut: current.clockOut };
      saveCurrent(); saveWeek(); render();
    }
    $("editInPanel").classList.remove("open");
  });
  $("saveOut").addEventListener("click", function () {
    if (!current) {
      alert("먼저 출근 버튼을 눌러주세요.");
      return;
    }
    const ts = readTimeInputs("out");
    if (ts === null) return;
    finishShift(ts);
    $("editOutPanel").classList.remove("open");
  });

  try {
    loadData();
    render();
    setInterval(render, 1000);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { loadData(); render(); }
    });
    window.addEventListener("pageshow", function () { loadData(); render(); });
  } catch (error) {
    $("status").textContent = "앱 오류: 새로고침해 주세요";
    console.error("Attendance app error:", error);
    alert("앱 초기화 중 오류가 발생했습니다. 페이지를 새로고침해 주세요.");
  }

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (e) {
        console.error("Service worker registration failed:", e);
      });
    });
  }
})();
</script>
</body>
</html>
