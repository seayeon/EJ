<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="근태 기록">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>근태 기록</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151d31;--muted:#9aa7bd;--line:#28334a;--green:#49d49a;--white:#f5f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a2945 0,#0b1020 58%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
main{width:100%;max-width:480px;padding:34px 0 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:15px;font-weight:700;letter-spacing:.04em}.today{font-size:12px;color:var(--muted);text-align:right}
.panel{background:linear-gradient(145deg,rgba(29,41,65,.96),rgba(19,28,47,.96));border:1px solid var(--line);border-radius:26px;padding:26px 22px;box-shadow:0 18px 55px #0005}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.12em;font-weight:700}.timer{font-size:clamp(46px,13vw,64px);font-weight:750;letter-spacing:-.055em;font-variant-numeric:tabular-nums;margin:12px 0 4px}.sub{font-size:13px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:19px;border:1px solid #326a5a;background:#153b33;color:#8cf0c3;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:700}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green)}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.detail{background:#0e1729;border:1px solid var(--line);border-radius:17px;padding:16px}.label{font-size:12px;color:var(--muted);margin-bottom:9px}.value{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
button{width:100%;border:0;border-radius:15px;padding:17px;margin-top:13px;background:var(--green);color:#06271c;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 9px 24px #49d49a30}button:disabled{background:#344258;color:#9aa7bd;box-shadow:none;cursor:default}
button.secondary{background:#26344d;color:#e7edf8;border:1px solid #3b4b67;box-shadow:none}
.editor{display:none;margin-top:16px;padding:16px;background:#0e1729;border:1px solid var(--line);border-radius:17px}.editor.open{display:block}.editor label{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}
input[type=number]{width:100%;padding:14px 8px;border-radius:12px;border:1px solid #40506a;background:#18243a;color:#fff;font:700 20px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center}
.time-parts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.time-parts label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{margin-top:12px}
.note{font-size:12px;line-height:1.65;color:var(--muted);margin:18px 3px 0}.foot{text-align:center;color:#66748c;font-size:11px;margin-top:25px}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand">◷ &nbsp;근태 기록</div><div class="today" id="dateLabel">오늘</div></div>
  <section class="panel">
    <div class="eyebrow">TODAY'S WORK TIME</div>
    <div class="timer" id="timer">00:00:00</div>
    <div class="sub">오늘 누적 근무 시간</div>
    <div class="status" id="status">출근 전</div>
    <div class="details">
      <div class="detail"><div class="label">출근 시간</div><div class="value" id="clockIn">--:--:--</div></div>
      <div class="detail"><div class="label">퇴근 시간</div><div class="value" id="clockOut">--:--:--</div></div>
    </div>
    <div class="detail" style="margin-top:12px">
      <div class="label" id="weekLabel">이번 주 누적 근무 시간</div>
      <div class="value" id="weekTotal" style="font-size:25px">00:00:00</div>
      <div class="sub" id="weekRange" style="margin-top:6px">월요일 ~ 일요일</div>
    </div>
    <div class="actions">
      <button id="clockInButton">출근</button>
      <button id="clockOutButton">퇴근</button>
    </div>
    <div class="actions">
      <button class="secondary" id="editInToggle">출근 시간 수정</button>
      <button class="secondary" id="editOutToggle">퇴근 시간 수정</button>
    </div>
    <div class="editor" id="editInPanel">
      <label>출근 시간 (시·분·초)</label>
      <div class="time-parts">
        <div><label for="inHour">시</label><input id="inHour" type="number" min="0" max="23" inputmode="numeric" placeholder="09"></div>
        <div><label for="inMinute">분</label><input id="inMinute" type="number" min="0" max="59" inputmode="numeric" placeholder="00"></div>
        <div><label for="inSecond">초</label><input id="inSecond" type="number" min="0" max="59" inputmode="numeric" placeholder="00"></div>
      </div>
      <div class="actions">
        <button class="secondary" id="cancelIn">취소</button>
        <button id="saveIn">출근 시간 저장</button>
      </div>
    </div>
    <div class="editor" id="editOutPanel">
      <label>퇴근 시간 (시·분·초)</label>
      <div class="time-parts">
        <div><label for="outHour">시</label><input id="outHour" type="number" min="0" max="23" inputmode="numeric" placeholder="18"></div>
        <div><label for="outMinute">분</label><input id="outMinute" type="number" min="0" max="59" inputmode="numeric" placeholder="00"></div>
        <div><label for="outSecond">초</label><input id="outSecond" type="number" min="0" max="59" inputmode="numeric" placeholder="00"></div>
      </div>
      <div class="actions">
        <button class="secondary" id="cancelOut">취소</button>
        <button id="saveOut">퇴근 시간 저장</button>
      </div>
    </div>
  </section>
  <p class="note">출근 버튼으로 측정을 시작하고 퇴근 버튼으로 종료합니다. 퇴근 시간도 직접 입력하거나 수정할 수 있습니다. 자정까지 퇴근 기록이 없으면 자정에 자동 종료되며, 주간 누적은 월요일에 초기화됩니다. 기록은 이 기기의 브라우저에만 저장됩니다.</p>
  <div class="foot">개인용 근태 기록 · 이 기기에서만 사용</div>
</main>
<script>
(() => {
  const KEY = "personal-attendance-v1";
  const WEEK_KEY = "personal-attendance-week-v1";
  const $ = id => document.getElementById(id);
  let record = null;
  let weekRecords = {};

  function dayKey(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  function dateFromKey(key) {
    const [y,m,d] = key.split("-").map(Number);
    return new Date(y,m-1,d,0,0,0,0);
  }
  function mondayOf(d = new Date()) {
    const x = new Date(d.getFullYear(),d.getMonth(),d.getDate());
    x.setDate(x.getDate() - ((x.getDay()+6)%7));
    return x;
  }
  function weekKey(d = new Date()) { return dayKey(mondayOf(d)); }
  function saveWeek() {
    localStorage.setItem(WEEK_KEY,JSON.stringify({week:weekKey(),days:weekRecords}));
  }
  function loadWeek() {
    try {
      const saved = JSON.parse(localStorage.getItem(WEEK_KEY)||"null");
      if (saved && saved.week===weekKey() && saved.days && typeof saved.days==="object") {
        weekRecords=saved.days;
      } else {
        weekRecords={};
        localStorage.setItem(WEEK_KEY,JSON.stringify({week:weekKey(),days:weekRecords}));
      }
    } catch {
      weekRecords={};
      localStorage.setItem(WEEK_KEY,JSON.stringify({week:weekKey(),days:weekRecords}));
    }
    // Migrate older weekly entries (clock-in timestamp only) to a completed day ending at midnight.
    for (const [key,value] of Object.entries(weekRecords)) {
      if (typeof value==="number") {
        const start=value, dayStart=dateFromKey(key).getTime();
        weekRecords[key]={clockIn:start,clockOut:dayStart+24*60*60*1000};
      }
    }
    saveWeek();
  }
  function storeRecord() {
    if (record) localStorage.setItem(KEY,JSON.stringify(record));
    else localStorage.removeItem(KEY);
  }
  function loadRecord() {
    try {
      const saved=JSON.parse(localStorage.getItem(KEY)||"null");
      record=saved && Number.isFinite(saved.clockIn) ? saved : null;
    } catch { record=null; }
    const today=dayKey();
    if (record && record.date!==today) {
      // A still-open shift is automatically closed at midnight of its recorded day.
      const oldDayStart=dateFromKey(record.date).getTime();
      const midnight=oldDayStart+24*60*60*1000;
      const oldWeek=weekKey(dateFromKey(record.date));
      if (oldWeek===weekKey()) {
        weekRecords[record.date]={clockIn:record.clockIn,clockOut:record.clockOut ?? midnight};
        saveWeek();
      }
      record=null;
      storeRecord();
    }
    if (record) {
      weekRecords[today]={clockIn:record.clockIn,clockOut:record.clockOut ?? null};
      saveWeek();
    }
  }
  function fmtTime(d) {
    return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,"0")).join(":");
  }
  function fmtDuration(ms) {
    const sec=Math.max(0,Math.floor(ms/1000));
    const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
    return [h,m,s].map(n=>String(n).padStart(2,"0")).join(":");
  }
  function durationForDay(key,entry,now) {
    const start=dateFromKey(key).getTime();
    const inTime=typeof entry==="number"?entry:entry.clockIn;
    if (!Number.isFinite(inTime)) return 0;
    let outTime=typeof entry==="number" ? start+86400000 : entry.clockOut;
    if (!Number.isFinite(outTime)) outTime=Math.min(now.getTime(),start+86400000);
    return Math.max(0,outTime-inTime);
  }
  function weeklyMilliseconds(now) {
    const start=mondayOf(now).getTime();
    const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1).getTime();
    let total=0;
    for (const [key,entry] of Object.entries(weekRecords)) {
      const dayStart=dateFromKey(key).getTime();
      if (dayStart<start || dayStart>=end) continue;
      total+=durationForDay(key,entry,now);
    }
    return total;
  }
  function saveClockIn(timestamp) {
    const today=dayKey();
    record={date:today,clockIn:timestamp,clockOut:null};
    weekRecords[today]={clockIn:timestamp,clockOut:null};
    storeRecord(); saveWeek(); render();
  }
  function saveClockOut(timestamp) {
    if (!record) return;
    if (timestamp<record.clockIn) {
      alert("퇴근 시간은 출근 시간보다 늦어야 합니다."); return;
    }
    record.clockOut=timestamp;
    weekRecords[record.date]={clockIn:record.clockIn,clockOut:timestamp};
    storeRecord(); saveWeek(); render();
  }
  function getInputTimestamp(prefix) {
    const h=Number($(prefix+"Hour").value),m=Number($(prefix+"Minute").value),s=Number($(prefix+"Second").value);
    if ([h,m,s].some((v,i)=>$(prefix+["Hour","Minute","Second"][i]).value==="") ||
       !Number.isInteger(h)||!Number.isInteger(m)||!Number.isInteger(s)||h<0||h>23||m<0||m>59||s<0||s>59) {
      alert("시(0~23), 분(0~59), 초(0~59)를 올바르게 입력해 주세요."); return null;
    }
    const n=new Date(),ts=new Date(n.getFullYear(),n.getMonth(),n.getDate(),h,m,s,0).getTime();
    if (ts>Date.now() && !confirm("현재 시각보다 늦은 시간입니다. 이 시간으로 저장할까요?")) return null;
    return ts;
  }
  function fillInputs(prefix,ts) {
    const d=new Date(ts);
    $(prefix+"Hour").value=String(d.getHours()).padStart(2,"0");
    $(prefix+"Minute").value=String(d.getMinutes()).padStart(2,"0");
    $(prefix+"Second").value=String(d.getSeconds()).padStart(2,"0");
  }
  function render() {
    const now=new Date(),today=dayKey(now);
    if (record && record.date!==today) loadRecord();
    if (JSON.parse(localStorage.getItem(WEEK_KEY)||"null")?.week!==weekKey(now)) {
      weekRecords={}; saveWeek();
    }
    $("dateLabel").textContent=new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(now);
    $("now").textContent=fmtTime(now);
    const monday=mondayOf(now),sunday=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+6);
    const rf=d=>`${d.getMonth()+1}.${d.getDate()}`;
    $("weekRange").textContent=`${rf(monday)} ~ ${rf(sunday)} 기준`;
    if (record) {
      const end=record.clockOut ?? now.getTime();
      $("timer").textContent=fmtDuration(end-record.clockIn);
      $("clockIn").textContent=fmtTime(new Date(record.clockIn));
      $("clockOut").textContent=record.clockOut?fmtTime(new Date(record.clockOut)):"근무 중";
      $("status").innerHTML=record.clockOut? "퇴근 완료" : '<span class="dot"></span> 근무 중';
      $("clockInButton").disabled=true;
      $("clockOutButton").disabled=!!record.clockOut;
      $("editOutToggle").disabled=false;
    } else {
      $("timer").textContent="00:00:00";
      $("clockIn").textContent="--:--:--";
      $("clockOut").textContent="--:--:--";
      $("status").textContent="출근 전";
      $("clockInButton").disabled=false;
      $("clockOutButton").disabled=true;
      $("editOutToggle").disabled=false;
    }
    $("weekTotal").textContent=fmtDuration(weeklyMilliseconds(now));
  }
  $("clockInButton").addEventListener("click",()=>{
    if (record && !record.clockOut) {
      alert("이미 근무 중입니다. 먼저 퇴근 처리해 주세요."); return;
    }
    if (record && record.clockOut) {
      alert("오늘은 이미 퇴근 처리했습니다."); return;
    }
    saveClockIn(Date.now());
  });
  $("clockOutButton").addEventListener("click",()=>{
    if (!record) {
      alert("먼저 출근 기록을 해주세요."); return;
    }
    if (record.clockOut) {
      alert("이미 퇴근 처리했습니다."); return;
    }
    saveClockOut(Date.now());
  });
  $("editInToggle").addEventListener("click",()=>{
    const panel=$("editInPanel");
    if (!panel.classList.contains("open")) {
      fillInputs("in",record?record.clockIn:Date.now());
      panel.classList.add("open");
    } else panel.classList.remove("open");
  });
  $("editOutToggle").addEventListener("click",()=>{
    if (!record) {
      alert("퇴근 시간을 기록하려면 먼저 출근 버튼을 눌러주세요.");
      return;
    }
    const panel=$("editOutPanel");
    if (!panel.classList.contains("open")) {
      fillInputs("out",record.clockOut ?? Date.now());
      panel.classList.add("open");
    } else panel.classList.remove("open");
  });
  $("cancelIn").addEventListener("click",()=>$("editInPanel").classList.remove("open"));
  $("cancelOut").addEventListener("click",()=>$("editOutPanel").classList.remove("open"));
  $("saveIn").addEventListener("click",()=>{
    const ts=getInputTimestamp("in"); if(ts===null)return;
    if(record && record.clockOut!==null && ts>record.clockOut){alert("출근 시간은 퇴근 시간보다 빨라야 합니다.");return;}
    if (record) {
      record.clockIn=ts;
      weekRecords[record.date]={clockIn:ts,clockOut:record.clockOut ?? null};
      storeRecord(); saveWeek(); render();
    } else {
      saveClockIn(ts);
    }
    $("editInPanel").classList.remove("open");
  });
  $("saveOut").addEventListener("click",()=>{
    if(!record) {
      alert("먼저 출근 기록을 해주세요.");
      return;
    }
    const ts=getInputTimestamp("out");
    if(ts===null)return;
    if(ts<record.clockIn) {
      alert("퇴근 시간은 출근 시간보다 늦어야 합니다.");
      return;
    }
    saveClockOut(ts);
    $("editOutPanel").classList.remove("open");
  });
  loadWeek(); loadRecord(); render();
  setInterval(render,250);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadWeek();loadRecord();render();}});
  window.addEventListener("pageshow",()=>{loadWeek();loadRecord();render();});
  if("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
