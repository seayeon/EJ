
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>개인 근태 기록</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 18px;
      background: #111827;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .container {
      max-width: 430px;
      margin: 30px auto;
    }
    h1 { font-size: 25px; }
    .card {
      background: #1f2937;
      border-radius: 18px;
      padding: 22px;
      margin: 18px 0;
    }
    .label {
      color: #9ca3af;
      font-size: 14px;
    }
    .time {
      font-size: 36px;
      font-weight: bold;
      margin: 12px 0;
      font-variant-numeric: tabular-nums;
    }
    .weekly {
      font-size: 32px;
      color: #60a5fa;
      font-weight: bold;
      margin-top: 12px;
      font-variant-numeric: tabular-nums;
    }
    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
    }
    button.secondary { background: #374151; }
    input {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #4b5563;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 18px;
    }
    .inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .inputs label {
      color: #9ca3af;
      font-size: 13px;
    }
    .small {
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>근태 기록</h1>
  <div class="small" id="today"></div>

  <div class="card">
    <div class="label">오늘 출근 시간</div>
    <div class="time" id="clockIn">미기록</div>
    <div class="label">오늘 근무 경과 시간</div>
    <div class="time" id="elapsed">00:00:00</div>
    <button onclick="recordClockIn()">현재 시간으로 출근 기록</button>
  </div>

  <div class="card">
    <div class="label">이번 주 누적 시간</div>
    <div class="weekly" id="weekly">00:00:00</div>
    <div class="small">월요일부터 오늘까지의 출근 경과 시간 합계</div>
  </div>

  <div class="card">
    <div class="label">출근 시간 직접 수정</div>
    <div class="inputs">
      <label>시
        <input id="hour" type="number" min="0" max="23" placeholder="시">
      </label>
      <label>분
        <input id="minute" type="number" min="0" max="59" placeholder="분">
      </label>
      <label>초
        <input id="second" type="number" min="0" max="59" placeholder="초">
      </label>
    </div>
    <button class="secondary" onclick="saveManualTime()">수정 시간 저장</button>
  </div>
</div>

<script>
const DAILY_KEY = "personal-attendance-v1";
const WEEKLY_KEY = "personal-attendance-weekly-v1";

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function mondayKey(date) {
  const monday = new Date(date);
  const day = monday.getDay();
  monday.setDate(monday.getDate() - (day === 0 ? 6 : day - 1));
  monday.setHours(0, 0, 0, 0);
  return dateKey(monday);
}

function formatTime(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return [h, m, s].map(v => String(v).padStart(2, "0")).join(":");
}

function loadDaily() {
  const today = dateKey(new Date());
  let data;

  try {
    data = JSON.parse(localStorage.getItem(DAILY_KEY));
  } catch {
    data = null;
  }

  if (!data || data.date !== today) {
    localStorage.removeItem(DAILY_KEY);
    return null;
  }

  return data;
}

function saveDaily(clockIn) {
  const data = {
    date: dateKey(new Date()),
    clockIn: clockIn
  };
  localStorage.setItem(DAILY_KEY, JSON.stringify(data));
}

function loadWeekly() {
  const key = mondayKey(new Date());
  let data;

  try {
    data = JSON.parse(localStorage.getItem(WEEKLY_KEY));
  } catch {
    data = null;
  }

  if (!data || data.week !== key) {
    data = { week: key, days: {} };
    localStorage.setItem(WEEKLY_KEY, JSON.stringify(data));
  }

  return data;
}

function recordClockIn() {
  const now = new Date();
  saveDaily(now.getTime());
  render();
}

function saveManualTime() {
  const h = Number(document.getElementById("hour").value);
  const m = Number(document.getElementById("minute").value);
  const s = Number(document.getElementById("second").value);

  if (
    document.getElementById("hour").value === "" ||
    document.getElementById("minute").value === "" ||
    document.getElementById("second").value === "" ||
    !Number.isInteger(h) || !Number.isInteger(m) ||
    !Number.isInteger(s) ||
    h < 0 || h > 23 || m < 0 || m > 59 ||
    s < 0 || s > 59
  ) {
    alert("시, 분, 초를 올바르게 입력해 주세요.");
    return;
  }

  const now = new Date();
  const clockIn = new Date(
    now.getFullYear(), now.getMonth(), now.getDate(),
    h, m, s
  );

  if (clockIn.getTime() > now.getTime()) {
    if (!confirm("현재 시간보다 미래입니다. 저장할까요?")) return;
  }

  saveDaily(clockIn.getTime());
  render();
  alert("출근 시간이 수정되었습니다.");
}

function render() {
  const now = new Date();
  document.getElementById("today").textContent =
    now.getFullYear() + "년 " +
    (now.getMonth() + 1) + "월 " +
    now.getDate() + "일";

  const daily = loadDaily();
  let elapsed = 0;

  if (daily) {
    const start = Number(daily.clockIn);
    document.getElementById("clockIn").textContent =
      new Date(start).toLocaleTimeString("ko-KR", {
        hour12: false
      });

    elapsed = Math.max(0, Math.floor((now.getTime() - start) / 1000));
    document.getElementById("elapsed").textContent =
      formatTime(elapsed);

    const startDate = new Date(start);
    document.getElementById("hour").value = startDate.getHours();
    document.getElementById("minute").value = startDate.getMinutes();
    document.getElementById("second").value = startDate.getSeconds();
  } else {
    document.getElementById("clockIn").textContent = "미기록";
    document.getElementById("elapsed").textContent = "00:00:00";
  }

  const weekly = loadWeekly();
  const todayKey = dateKey(now);

  // 오늘 경과 시간은 실시간으로 계산
  // 지난 날짜의 기록은 저장된 일별 초를 사용
  weekly.days[todayKey] = elapsed;

  // 이번 주 월요일 이전의 데이터 제거
  const weekStart = mondayKey(now);
  for (const key of Object.keys(weekly.days)) {
    if (key < weekStart || key > todayKey) {
      delete weekly.days[key];
    }
  }

  localStorage.setItem(WEEKLY_KEY, JSON.stringify(weekly));

  const total = Object.values(weekly.days)
    .reduce((sum, value) => sum + Number(value || 0), 0);

  document.getElementById("weekly").textContent =
    formatTime(total);
}

render();
setInterval(render, 1000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) render();
});

window.addEventListener("pageshow", render);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
